name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # The suite runs against a fake llama-server and a fake Hub; nothing is downloaded.
      - run: bun test ./src ./test
      - name: Build the host binary and run it
        run: |
          bun run build
          ./obrew --version || ./obrew.exe --version
        shell: bash
