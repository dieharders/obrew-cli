# Existing tag `vX.Y.Z` → one executable per platform on the GitHub release, plus SHA256SUMS.
#
# Run manually only (Actions → Release → Run workflow), so pushing a tag never publishes on
# its own. Push the tag first, then pick it in "Use workflow from" and run — that dropdown IS
# the tag picker, and the `tag` box below only exists to override it.
#
# Asset names are the contract with hosts that install obrew for the user: MotionBuff's
# managed installer fetches `obrew-<target>[.exe]` from the latest release and verifies the
# `digest` GitHub records for every asset. Rename an asset here and that installer breaks.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override: release this tag instead of the one selected above'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `workflow_dispatch` inputs can only be a string, a boolean, or a `choice` with a
      # hardcoded list — none of which can enumerate tags — so there is no way to offer a tag
      # dropdown of our own. The "Use workflow from" ref picker already is one: dispatching
      # from a tag sets ref_type=tag and ref_name=<the tag>, so read it from there and leave
      # the input as an override for the rare case of running one tag's workflow on another.
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::'Use workflow from' selected the $REF_TYPE '$REF_NAME', not a tag. Pick a tag there, or type one in the override box."
              exit 1
            fi
            tag="$REF_NAME"
          fi
          echo "Releasing $tag"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun test ./src ./test
      # `bun build --compile --target` cross-compiles: one Linux runner produces all five.
      - run: bun run build:all
      - name: Smoke the Linux build
        run: ./dist/obrew-linux-x64 --version
      - uses: softprops/action-gh-release@v2
        with:
          # The checkout is a detached tag, not a tag ref, so name the release explicitly.
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            dist/obrew-windows-x64.exe
            dist/obrew-darwin-arm64
            dist/obrew-darwin-x64
            dist/obrew-linux-x64
            dist/obrew-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
